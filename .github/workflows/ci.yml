name: LumioSample CI

on:
  push:
    branches: [main]
  pull_request:
  # ADR-113 决策 6: the zero-skip obligation binds `push` to main and a daily
  # job, not PRs. The server-host job below carries it, so this workflow needs a
  # daily trigger to have somewhere to carry it to.
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

# ADR-123: the engine is the read-only submodule Engine/ (LumioEngineRelease, a public
# repository pinned at a release tag). Every job gets it with the checkout
# (`submodules: true`) and nothing else: no private repository is checked out and no
# secret is read anywhere in this workflow. Until Engine/ is pinned to its first tag
# (R-00782) the submodule is empty and the build fails with LUMIO_SDK_UNRESOLVED — the
# designed failure, not a broken job.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: LumioSample
    steps:
      # This job's checkout is named `LumioSample`: the ADR-115 directory contract check
      # below identifies the repository by its checkout directory name (R-00719).
      - uses: actions/checkout@v7
        with:
          path: LumioSample
          submodules: true
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: LumioSample/global.json
      - run: dotnet build LumioSample.slnx
      # Everything below runs after the build and, on a pull request, cannot fail the
      # job: there this job's red or green is decided by compiling alone (ADR-088; R-00739).
      - name: Checkout Workflow spec-lint
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v7
        with:
          repository: LumioGames/workflow-plugin
          ref: dc8cab318d7509978b17a144120c93a1753e0510
          path: .run/workflow-plugin
          persist-credentials: false
      - uses: actions/setup-node@v7
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: Spec lint
        # spec-lint reports and does not fail the job (ADR-088): read the output. The
        # ADR-115 directory contract lives in the (private) architecture repository, which
        # this job does not check out, so its `lumio-repo-layout` line reports BLOCKED_ENV
        # here; the architecture repository's Sample regression runs that check.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          WORKFLOW_PLUGIN_ROOT: ${{ github.workspace }}/.run/workflow-plugin
        run: node .spec/tools/lint-extensions.mjs

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: sample-source
    env:
      LUMIO_CONFIG_ROOT: ${{ github.workspace }}/LumioConfig
    steps:
      - uses: actions/checkout@v7
        with:
          path: sample-source
          submodules: true
          persist-credentials: false
      # S2 zero-diff: Tools/sync-config-readers.test.mjs re-runs LumioConfig
      # `export --csharp-out` against the committed Readers. LumioConfig is public.
      - name: Checkout LumioConfig
        uses: actions/checkout@v7
        with:
          repository: LumioGames/LumioConfig
          path: LumioConfig
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: sample-source/global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      # GAS Activate has no C# AbilityStateTable fallback: the mine/move wiring tests load
      # lumio-hfsm from the release native (Engine/server/<rid>/SDK/Native/<rid>/) and fail,
      # never skip, when it is not there (Server/Tests/EngineRelease.cs).
      - run: dotnet test LumioSample.slnx -- --minimum-expected-tests 1
      # Compile guard for the spectator: both game sources against the release's browser
      # replica DLLs (Engine/web/replica/netstandard2.1/, incl. Lumio.Client.Spectator.dll)
      # and this game's client gameplay. Compile only; the wasm host needs wasm-tools.
      - name: Build spectator shared sources against the pinned engine
        run: dotnet build Client/UI/Spectator/tests/Lumio.Sample.Client.Spectator.Tests.csproj -c Release
      - name: Spectator page (node)
        run: node --test Client/UI/Spectator/main.test.mjs
      - run: node --test Tools/verify-evidence.mjs
      - run: node --test Tools/engine-release.test.mjs
      - run: node --test Tools/update-engine.test.mjs
      - run: node --test Tools/account-client.test.mjs
      - run: node --test Tools/ds-ready.test.mjs
      - run: node --test Tools/launcher.test.mjs
      - run: node --test Tools/stress-move.test.mjs
      - run: node --test Tools/world-assert.test.mjs
      - run: node --test Tools/capture-basemap.test.mjs
      - run: node --test Tools/server-profile.test.mjs
      - run: node --test Tools/ds-config.test.mjs
      - run: node --test Tools/sync-config-readers.test.mjs
      # Pure unit checks over the server-host wiring: no engine binary needed, so they
      # run on every PR even though the job they guard is push/schedule only.
      - run: node --test Tools/test-server-host.test.mjs
      - run: node --test Tools/prepare-server-host-inputs.test.mjs

  # ADR-123 验证 Fixture 1: what an outsider does. A plain anonymous `git clone
  # --recursive` of this public repository — no actions/checkout, no token, no other
  # repository — and `dotnet build`. Before the first engine tag is pinned this is the
  # LUMIO_SDK_UNRESOLVED failure by design.
  external-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone like an outsider (anonymous, --recursive)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          git clone --recursive "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/external"
          cd "$RUNNER_TEMP/external"
          git fetch --depth 1 origin "$HEAD_SHA"
          git checkout --detach "$HEAD_SHA"
          # The commit under test may pin another engine than the default branch.
          git submodule update --init --depth 1 Engine
          git submodule status
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ runner.temp }}/external/global.json
      - name: Build the clone
        working-directory: ${{ runner.temp }}/external
        run: dotnet build LumioSample.slnx

  # R-00692 moved LumioServer's two engine-level admit/spawn cases here. What they
  # guard is the engine's contract on this game's registry: the retained catalog bytes
  # are a defensive copy; a corrupted voxel half makes restore refuse without changing
  # the live `Manager`; a successful restore keeps `IngressBudget` identity while
  # `Manager` is new; `ActivationContextFactory` answers only for `MineAbility`; a
  # `runtime-only` snapshot carries no `voxelBase64`; `Physics` follows the voxel profile.
  #
  # ADR-123: HostEntry, the Runtime three-path and the native image are the Engine/
  # release's; the gameplay is built against that release's SDK, the only one the build
  # knows (ADR-102 matched release); the catalog world is authored by this game on that
  # release native (R-00785).
  # ADR-113 决策 6 / ADR-088: push to main and the daily job only.
  server-host:
    name: Engine admit/spawn cases on the Sample registry (ADR-115 §3)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sample-source
    steps:
      - uses: actions/checkout@v7
        with:
          path: sample-source
          submodules: true
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: sample-source/global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: Build the server-side Sample gameplay against the pinned engine
        run: dotnet build Gameplay/Lumio.Sample.Gameplay.csproj -c Release
      # The voxel case's catalog world is this game's own (R-00785, ADR-117): its base map
      # restored on the release native, one public write, one capture. The Gameplay test that
      # authors and checks it writes the three files where LUMIO_SAMPLE_CATALOG_WORLD_OUTPUT says.
      - name: Author the catalog world on the release native
        env:
          LUMIO_SAMPLE_CATALOG_WORLD_OUTPUT: ${{ runner.temp }}/catalog-world
        run: >-
          dotnet test Tools/Lumio.Sample.Gameplay.Tests/Lumio.Sample.Gameplay.Tests.csproj -c Release --
          --filter-method Lumio.Sample.Gameplay.Tests.CatalogWorldTests.AuthorsTheWallSceneOnTheReleaseNative
          --minimum-expected-tests 1
      # Checks every engine input in Engine/ (fails by name, nothing is skipped) and the
      # catalog world's evidence against the release native, then exports the game-side
      # values through GITHUB_ENV.
      - name: Name the host suite inputs
        run: node Tools/prepare-server-host-inputs.mjs --gameplay-bin Gameplay/bin/Release/net10.0 --voxel-fixture "$RUNNER_TEMP/catalog-world"
      # HostEntry is one process-scoped managed context, so the runner gives each case its
      # own process. The HOST_SUITE line is asserted rather than trusted: `skipped=0` is the
      # ADR-113 决策 1 measurement.
      - name: Run the two engine admit/spawn cases
        run: |
          set -euo pipefail
          node Tools/test-server-host.mjs "$RUNNER_TEMP/host-results" | tee "$RUNNER_TEMP/host-suite.txt"
          grep -q 'HOST_SUITE cases=2 total=2 passed=2 failed=0 skipped=0' "$RUNNER_TEMP/host-suite.txt"
      - name: Retain the per-case logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-host-results
          path: |
            ${{ runner.temp }}/host-results/**
            ${{ runner.temp }}/host-suite.txt
          if-no-files-found: warn
          retention-days: 7
