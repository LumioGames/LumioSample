name: LumioSample CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sample-source
    env:
      LumioRuntimeRoot: ${{ github.workspace }}/LumioGameRuntime
    steps:
      # Sibling layout (same as external-clone): Sample's Directory.Packages.props
      # must not sit above Engine. Checking Engine out under the Sample tree
      # makes CPM apply to NativeLoader and fails NU1008.
      - uses: actions/checkout@v7
        with:
          path: sample-source
      - name: Checkout LumioGameRuntime
        uses: actions/checkout@v7
        with:
          repository: LumioGames/LumioGameRuntime
          path: LumioGameRuntime
          token: ${{ secrets.LUMIO_CI_PAT }}
          persist-credentials: false
      # Runtime net10.0 Ecs/Simulation bind NativeLoader (QueryAabb / clock_now).
      # They probe ../LumioGameEngine from the Runtime root. That is a CI
      # sibling checkout, not a Sample ProjectReference.
      - name: Checkout LumioGameEngine
        uses: actions/checkout@v7
        with:
          repository: LumioGames/LumioGameEngine
          path: LumioGameEngine
          token: ${{ secrets.LUMIO_CI_PAT }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: sample-source/global.json
      - run: dotnet build LumioSample.slnx -p:LumioArchRoot=${{ github.workspace }}/LumioGameEngine

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sample-source
    env:
      LumioRuntimeRoot: ${{ github.workspace }}/LumioGameRuntime
    steps:
      - uses: actions/checkout@v7
        with:
          path: sample-source
      - name: Checkout LumioGameRuntime
        uses: actions/checkout@v7
        with:
          repository: LumioGames/LumioGameRuntime
          path: LumioGameRuntime
          token: ${{ secrets.LUMIO_CI_PAT }}
          persist-credentials: false
      - name: Checkout LumioGameEngine
        uses: actions/checkout@v7
        with:
          repository: LumioGames/LumioGameEngine
          path: LumioGameEngine
          token: ${{ secrets.LUMIO_CI_PAT }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: sample-source/global.json
      - run: dotnet test LumioSample.slnx -p:LumioArchRoot=${{ github.workspace }}/LumioGameEngine -- --minimum-expected-tests 1
      - run: node --test integration/verify-evidence.mjs
      - run: node --test integration/account-client.test.mjs
      - run: node --test integration/ds-ready.test.mjs
      - run: node --test integration/launcher.test.mjs
      - run: node --test integration/stress-move.test.mjs
      - run: node --test integration/world-assert.test.mjs
      - run: node --test integration/capture-basemap.test.mjs

  external-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: sample-source
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: sample-source/global.json
      - name: Checkout LumioGameEngine
        uses: actions/checkout@v7
        with:
          repository: LumioGames/LumioGameEngine
          path: LumioGameEngine
          token: ${{ secrets.LUMIO_CI_PAT }}
          persist-credentials: false
      - name: Checkout LumioGameRuntime
        uses: actions/checkout@v7
        with:
          repository: LumioGames/LumioGameRuntime
          path: LumioGameRuntime
          token: ${{ secrets.LUMIO_CI_PAT }}
          persist-credentials: false
      - name: Checkout LumioNativeCore
        uses: actions/checkout@v7
        with:
          repository: LumioGames/LumioNativeCore
          path: LumioNativeCore
          token: ${{ secrets.LUMIO_CI_PAT }}
          persist-credentials: false
      - name: Checkout LumioVoxelEngine
        uses: actions/checkout@v7
        with:
          repository: LumioGames/LumioVoxelEngine
          path: LumioVoxelEngine
          token: ${{ secrets.LUMIO_CI_PAT }}
          persist-credentials: false
      - name: Clone PR head and pack the SDK locally
        working-directory: sample-source
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/external
          cd /tmp/external
          git fetch --depth 1 origin "${PR_HEAD}"
          git checkout --detach "${{ github.event.pull_request.head.sha || github.sha }}"
          test -z "${LumioRuntimeRoot:-}"
          test -z "${LumioLocalFeed:-}"
          node "$GITHUB_WORKSPACE/LumioGameEngine/eng/pack-sdk.mjs" --out /tmp/lumio-sdk-feed --runtime-root "$GITHUB_WORKSPACE/LumioGameRuntime" --native-core-root "$GITHUB_WORKSPACE/LumioNativeCore" --voxel-root "$GITHUB_WORKSPACE/LumioVoxelEngine"

      # 这个作业是全项目唯一真在 Linux x64 上跑 pack-sdk.mjs 的地方，所以它也是
      # R-00519 AC3（发布的 native 无开发机路径 / 私仓名）唯一能取到受验产物的落点。
      # 留成制品，验收方才拿得到那份 native 自己复核。if: always() 是因为后面的
      # dotnet build 可能因别的单（B-00069 / NU1403）红，制品与抽查结论不该被它带走。
      - name: Upload packed SDK nupkg
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-nupkg-linux-x64
          path: /tmp/lumio-sdk-feed/*.nupkg
          if-no-files-found: error

      # 泄漏抽查：解开刚打出来的包，对 runtimes/<rid>/native/ 下每个二进制扫一遍。
      # 词表与匹配语义的唯一落点是架构仓的 eng/leak-scan.mjs（R-00561 AC6）——本仓
      # 曾手抄一份 14 项词表，两处必然漂移（上游已扩到 16 词并加了 UTF-16LE 解码）。
      # 这里只负责「扫哪些文件」，扫出什么算命中由上游那一份定。
      # 命中即 exit 1——这是闸门不是提示，绝不能降级成 warning 或改扫描面变绿。
      # 真命中说明上游 eng/pack-sdk.mjs 的 --remap-path-prefix / HOST_LEAKS 有缺口，
      # 应停下交回架构仓处理（见任务卡 R-00560「阻塞与升级」）。
      - name: Scan packed native binaries for host-path and private-repo leaks
        run: |
          set -euo pipefail

          SCAN_DIR=/tmp/lumio-nupkg-scan
          rm -rf "$SCAN_DIR"
          mkdir -p "$SCAN_DIR"
          for nupkg in /tmp/lumio-sdk-feed/*.nupkg; do
            echo "unpacking $(basename "$nupkg")"
            unzip -q -o "$nupkg" -d "$SCAN_DIR"
          done

          # 只扫 runtimes/<rid>/native/ 下的真二进制；build-info.json 是 sidecar 元数据，
          # 上游 pack-sdk.mjs 已用 SIDECAR_LEAKS（词表的超集）单独管它，这里跳过免得口径打架。
          mapfile -t FILES < <(find "$SCAN_DIR" -type f -path '*/runtimes/*/native/*' ! -name 'build-info.json' | sort)

          # 一个文件都没扫到 = 抽查是空的，空的抽查不算证据，判失败。
          # 扫描器对空输入会打印 PASS，所以这一步必须留在这里，不能交给它。
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "FAIL: no native binaries found under runtimes/<rid>/native/ in the packed nupkg"
            find "$SCAN_DIR" -maxdepth 3 -type d | sort
            exit 1
          fi

          echo "=== scanned native binaries (${#FILES[@]}) ==="
          for f in "${FILES[@]}"; do
            printf '%10s bytes  %s\n' "$(stat -c '%s' "$f")" "${f#"$SCAN_DIR"/}"
          done

          # 词表、UTF-16LE 解码、标识符边界匹配与 RESULT 行全部来自上游这一份。
          node "$GITHUB_WORKSPACE/LumioGameEngine/eng/leak-scan.mjs" "${FILES[@]}"

      - name: Build the cloned sample against the locally packed SDK
        working-directory: /tmp/external
        run: dotnet build LumioSample.slnx -p:LumioLocalFeed=/tmp/lumio-sdk-feed
