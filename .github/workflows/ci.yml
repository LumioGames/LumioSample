name: LumioSample CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build LumioSample.slnx

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # --minimum-expected-tests 1 让「运行了零个测试」以退出码 9 失败,
      # 不许把「零个测试」当成通过(LumioGame 踩过这个坑)。
      - run: dotnet test LumioSample.slnx -- --minimum-expected-tests 1

  external-clone:
    # 本仓的核心尺子:外部开发者视角。必须在**没有任何同级 Lumio 仓**的干净机器上
    # clone 后直接编译成功——「clone 即编译」是这个仓存在的全部理由。
    # 引擎包接进来(S-2)之后这条依然要绿;绿不了就是包没发好,当天修,不要放宽这里。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Clone into a bare directory and build
        run: |
          git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/external
          cd /tmp/external
          dotnet build LumioSample.slnx
