name: LumioSample CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LumioRuntimeRoot: ${{ github.workspace }}/.runtime-source
    steps:
      - uses: actions/checkout@v7
      - name: Checkout LumioGameRuntime
        uses: actions/checkout@v7
        with:
          repository: LumioGames/LumioGameRuntime
          path: .runtime-source
          token: ${{ secrets.LUMIO_CI_PAT }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build LumioSample.slnx

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LumioRuntimeRoot: ${{ github.workspace }}/.runtime-source
    steps:
      - uses: actions/checkout@v7
      - name: Checkout LumioGameRuntime
        uses: actions/checkout@v7
        with:
          repository: LumioGames/LumioGameRuntime
          path: .runtime-source
          token: ${{ secrets.LUMIO_CI_PAT }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet test LumioSample.slnx -- --minimum-expected-tests 1
      - run: node --test integration/

  external-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: sample-source
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: sample-source/global.json
      - name: Checkout LumioGameEngine
        uses: actions/checkout@v7
        with:
          repository: LumioGames/LumioGameEngine
          path: engine-source
          token: ${{ secrets.LUMIO_CI_PAT }}
          persist-credentials: false
      - name: Checkout LumioGameRuntime
        uses: actions/checkout@v7
        with:
          repository: LumioGames/LumioGameRuntime
          path: runtime-source
          token: ${{ secrets.LUMIO_CI_PAT }}
          persist-credentials: false
      - name: Checkout LumioNativeCore
        uses: actions/checkout@v7
        with:
          repository: LumioGames/LumioNativeCore
          path: native-core-source
          token: ${{ secrets.LUMIO_CI_PAT }}
          persist-credentials: false
      - name: Checkout LumioVoxelEngine
        uses: actions/checkout@v7
        with:
          repository: LumioGames/LumioVoxelEngine
          path: voxel-source
          token: ${{ secrets.LUMIO_CI_PAT }}
          persist-credentials: false
      - name: Clone PR head and pack the SDK locally
        working-directory: sample-source
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/external
          cd /tmp/external
          git fetch --depth 1 origin "${PR_HEAD}"
          git checkout "${{ github.event.pull_request.head.sha || github.sha }}"
          test -z "${LumioRuntimeRoot:-}"
          test -z "${LumioServerRoot:-}"
          test -z "${LumioEngineRoot:-}"
          test -z "${LumioLocalFeed:-}"
          node "$GITHUB_WORKSPACE/engine-source/eng/pack-sdk.mjs" --out /tmp/lumio-sdk-feed --runtime-root "$GITHUB_WORKSPACE/runtime-source" --native-core-root "$GITHUB_WORKSPACE/native-core-source" --voxel-root "$GITHUB_WORKSPACE/voxel-source"

      # 这个作业是全项目唯一真在 Linux x64 上跑 pack-sdk.mjs 的地方，所以它也是
      # R-00519 AC3（发布的 native 无开发机路径 / 私仓名）唯一能取到受验产物的落点。
      # 留成制品，验收方才拿得到那份 native 自己复核。if: always() 是因为后面的
      # dotnet build 可能因别的单（B-00069 / NU1403）红，制品与抽查结论不该被它带走。
      - name: Upload packed SDK nupkg
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-nupkg-linux-x64
          path: /tmp/lumio-sdk-feed/*.nupkg
          if-no-files-found: error

      # 泄漏抽查：解开刚打出来的包，对 runtimes/<rid>/native/ 下每个二进制扫一遍词表。
      # 命中即 exit 1——这是闸门不是提示，绝不能降级成 warning 或删词表变绿。
      # 真命中说明上游 eng/pack-sdk.mjs 的 --remap-path-prefix / HOST_LEAKS 有缺口，
      # 应停下交回架构仓处理（见任务卡 R-00560「阻塞与升级」）。
      - name: Scan packed native binaries for host-path and private-repo leaks
        run: |
          set -euo pipefail

          # 词表分两类：开发机 / CI 的绝对路径前缀，以及八个私有仓名。
          # 顺序无所谓，命中任意一条即失败。
          LEAK_TERMS=(
            '/Users/'
            '/home/'
            'C:\Work'
            'C:/Work'
            '/root/'
            'LumioGameEngineArchitecture'
            'LumioGameEngine'
            'LumioNativeCore'
            'LumioVoxelEngine'
            'LumioGameRuntime'
            'LumioServer'
            'LumioClient'
            'LumioSample'
            'lumio'  # TEMP(R-00560 AC4 反例自证): 必然命中，取证后立即回滚
          )

          # strings 来自 binutils，ubuntu-latest 自带；缺了要显式炸而不是静默跳过抽查。
          command -v strings >/dev/null || { echo "FAIL: strings(1) not available, cannot scan"; exit 1; }

          SCAN_DIR=/tmp/lumio-nupkg-scan
          rm -rf "$SCAN_DIR"
          mkdir -p "$SCAN_DIR"
          for nupkg in /tmp/lumio-sdk-feed/*.nupkg; do
            echo "unpacking $(basename "$nupkg")"
            unzip -q -o "$nupkg" -d "$SCAN_DIR"
          done

          # 只扫 runtimes/<rid>/native/ 下的真二进制；build-info.json 是 sidecar 元数据，
          # 上游 pack-sdk.mjs 已用 SIDECAR_LEAKS 单独管它，这里跳过免得口径打架。
          mapfile -t FILES < <(find "$SCAN_DIR" -type f -path '*/runtimes/*/native/*' ! -name 'build-info.json' | sort)

          # 一个文件都没扫到 = 抽查是空的，空的抽查不算证据，判失败。
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "FAIL: no native binaries found under runtimes/<rid>/native/ in the packed nupkg"
            find "$SCAN_DIR" -maxdepth 3 -type d | sort
            exit 1
          fi

          echo "=== scanned native binaries (${#FILES[@]}) ==="
          for f in "${FILES[@]}"; do
            printf '%10s bytes  %s\n' "$(stat -c '%s' "$f")" "${f#"$SCAN_DIR"/}"
          done

          echo "=== leak terms (${#LEAK_TERMS[@]}) ==="
          printf '  %s\n' "${LEAK_TERMS[@]}"

          echo "=== scanning ==="
          HITS=0
          for f in "${FILES[@]}"; do
            # 先把 strings 的输出落盘再 grep：管道里 grep 无匹配会让 pipefail 吞掉
            # strings 自身的失败，抽查就会静默变成「没命中」。这里让 strings 失败直接炸。
            if ! strings -a "$f" > /tmp/leak-strings.txt; then
              echo "FAIL: strings(1) failed on ${f#"$SCAN_DIR"/}"
              exit 1
            fi
            for t in "${LEAK_TERMS[@]}"; do
              # if 条件里 set -e 不生效，grep 无匹配返回 1 属正常路径。
              if grep -F -- "$t" /tmp/leak-strings.txt > /tmp/leak-hit.txt; then
                HITS=$((HITS + 1))
                echo "LEAK HIT: term '${t}' in ${f#"$SCAN_DIR"/}"
                sed -n '1,20p' /tmp/leak-hit.txt | sed 's/^/    /'
              fi
            done
          done

          if [ "$HITS" -ne 0 ]; then
            echo "RESULT: ${HITS} leak hit(s) across ${#FILES[@]} native binaries -- FAIL"
            echo "Do not shrink the term list to go green: this means the upstream LumioGameEngine"
            echo "pack-sdk.mjs nativeRustflags()/HOST_LEAKS coverage has a real gap. Escalate."
            exit 1
          fi
          echo "RESULT: 0 hits across ${#FILES[@]} native binaries and ${#LEAK_TERMS[@]} leak terms -- PASS"

      - name: Build the cloned sample against the locally packed SDK
        working-directory: /tmp/external
        run: dotnet build LumioSample.slnx -p:LumioLocalFeed=/tmp/lumio-sdk-feed
